    <!-- Preload Critical Above-The-Fold Profile Asset (Zero Flash / CLS = 0) -->
    <link rel="preload" as="image" href="/profile.jpg" fetchpriority="high" type="image/jpeg" />

    <!-- Google Fonts with Preconnect & display=swap for high-performance rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DotGothic16&family=Geist+Mono:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Inline Fast-Theme Script: Prevents Any Hydration Flash or White/Black Stutter -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var pref = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', pref);
          document.documentElement.classList.add(pref);
          document.documentElement.classList.remove(pref === 'dark' ? 'light' : 'dark');
          document.documentElement.style.colorScheme = pref;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
